<style>
@font-face { font-family:'Huninn'; src:url('../assets/huninn.woff2') format('woff2'); font-display:swap; }
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Huninn',system-ui,sans-serif;background:#F0F6FB;min-height:100vh;color:#33475B}
.wrap{max-width:760px;margin:0 auto;padding:26px 16px 60px}

.card{background:#fff;border-radius:22px;box-shadow:0 8px 26px rgba(51,71,91,.10);padding:18px;margin-bottom:18px}

/* --- 同步狀態 --- */
.status{display:flex;justify-content:center;margin-bottom:14px}
.status span{font-size:12px;color:#6B8299;background:#E2ECF5;border-radius:999px;padding:4px 12px}

.status span.bad{background:#FDEAE0;color:#B0563F}

/* --- 進度區 --- */
.progress{display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:center}
.donut{position:relative;width:170px;height:170px;flex:0 0 auto}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}

.gift{flex:1 1 220px;min-width:220px}

.gift .left{color:#6B8299;font-size:14px;margin-top:6px}

.milestones{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}

/* --- 三顆飲料按鈕 --- */
.date-row{display:flex;justify-content:center;margin-bottom:12px}
input[type=date]{font-family:inherit;font-size:15px;color:#33475B;
  border:2px solid #CFE0EE;border-radius:12px;padding:9px 12px;background:#FCFEFF;outline:none}
input[type=date]:focus{border-color:#3D7BC4}
button{font-family:inherit;border:none;cursor:pointer}
.drink-row{display:flex;gap:10px;flex-wrap:wrap}
.drink-btn{flex:1 1 150px;background:#3D7BC4;color:#fff;border-radius:16px;padding:16px 10px;
  font-size:17px;line-height:1.4;box-shadow:0 6px 16px rgba(61,123,196,.30)}
.drink-btn .pts{display:block;font-size:13px;opacity:.85}
.drink-btn:disabled{opacity:.55;cursor:wait;transform:none}
.drink-btn:active{transform:scale(.97)}
.drink-btn:disabled{opacity:.55;cursor:wait}
.hint{color:#9AB0C4;font-size:12px;margin-top:10px}
.err{color:#B0563F;font-size:13px;margin-top:8px;display:none}

/* --- 行事曆 --- */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-head .m{font-size:18px}
.nav-btn{background:#F0F6FB;color:#33475B;width:36px;height:36px;border-radius:50%;font-size:16px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{text-align:center;color:#9AB0C4;font-size:12px;padding:4px 0}
.day{position:relative;aspect-ratio:1;border-radius:10px;background:#FCFEFF;border:2px solid transparent;
  display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-size:14px}
.day.blank{background:transparent;cursor:default}
.day.today{border-color:#F0B429}
.day.sel{border-color:#3D7BC4}
.day .cnt{position:absolute;right:3px;top:3px;background:#3D7BC4;color:#fff;font-size:10px;
  min-width:16px;height:16px;border-radius:999px;display:flex;align-items:center;justify-content:center;padding:0 3px}
.day.has{background:#E2ECF5}

/* --- 當日清單 --- */
.day-title{font-size:15px;margin-bottom:8px}
.entry{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed #E2ECF5}
.entry:last-child{border-bottom:none}
.entry .bk{flex:1;font-size:16px}
.entry .p{color:#3D7BC4;font-size:14px}
.entry .pend{font-size:12px;color:#9AB0C4}
.del{background:#F0F6FB;color:#6B8299;padding:6px 12px;font-size:13px;border-radius:999px}
.empty{color:#9AB0C4;font-size:14px}
footer{text-align:center;color:#9AB0C4;font-size:13px;margin-top:30px}

/* --- 扣分紀錄小卡 --- */
.pen-box{border:2px dashed #E0B8A8;background:#FBF1EC}
.pen-title{font-size:17px;color:#8A5A48}
.pen-note{font-size:13px;color:#A8887A;margin-top:4px}
.pen-list{list-style:none;margin-top:10px}
.pen-list li{display:flex;gap:10px;align-items:baseline;padding:8px 0;border-top:1px dashed #F0DDD4;font-size:17px;color:#6E4A3C}
.pen-list .d{color:#A8887A;font-size:13px;flex:0 0 auto}
.pen-list .v{color:#B0563F;flex:0 0 auto}
.pen-list .r{flex:1;line-height:1.6}
.pen-list .r.none{color:#C4A99C}
.pz{display:inline-flex;align-items:center;vertical-align:middle;margin:0 .14em 0 0}
.pz .h{font-size:1em;line-height:1.25}
.pz .y{display:inline-flex;flex-direction:column;justify-content:center;margin-left:.06em}
.pz .y i{font-style:normal;font-size:.42em;line-height:1.15;color:#A8887A;text-align:center;font-family:'Huninn',system-ui,sans-serif}
.pz .t{font-size:.46em;color:#A8887A;align-self:center;line-height:1;font-family:'Huninn',system-ui,sans-serif}

/* --- 載入遮罩 --- */
#load-gate{position:fixed;inset:0;z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  background:rgba(255,255,255,.94);color:#6E5A50;font-size:17px;text-align:center;padding:24px;transition:opacity .25s}
#load-gate.hide{opacity:0;pointer-events:none}
#load-gate .spin{width:46px;height:46px;border-radius:50%;border:5px solid #E8E0F5;border-top-color:#6C4DD6;animation:lg-spin .9s linear infinite}
#load-gate .sub{font-size:13px;color:#A8988F}
@keyframes lg-spin{to{transform:rotate(360deg)}}

<h1>&#129475; Owen 的牛奶點數</h1>
<div class="sub">喝牛奶集點，每滿 100 點換一個禮物 &#127873;</div>
<div class="status"><span id="sync-status">同步中&hellip;</span></div>
<div class="pendbar" id="pend-bar" hidden></div>

<div class="card">
  <div class="progress">
    <div class="donut">
      <svg viewBox="0 0 170 170">
        <circle cx="85" cy="85" r="70" fill="none" stroke="#DCE8F2" stroke-width="18"/>
        <circle id="arc" cx="85" cy="85" r="70" fill="none" stroke="#3D7BC4" stroke-width="18"
                stroke-linecap="round" stroke-dasharray="0 440"/>
      </svg>
      <div class="center"><div class="num"><span id="total">0</span></div><div class="pct"><span id="pct">本輪 0 / 100</span></div></div>
    </div>
    <div class="gift">
      <div class="big">禮物進度</div>
      <div id="gift-msg"></div>
      <div class="milestones" id="miles"></div>
    </div>
  </div>
</div>

<div class="card pen-box" id="pen-box" hidden>
  <div class="pen-title" id="pen-title">&#9888;&#65039; 扣分紀錄</div>
  <div class="pen-note" id="pen-note">每一筆：閱讀、牛奶、跳繩三本各扣 10 分</div>
  <ul class="pen-list" id="pen-list"></ul>
</div>

<div class="card">
  <div class="date-row"><input type="date" id="in-date" required></div>
  <div class="drink-row" id="drink-btns">
    <button class="drink-btn" data-kind="小安素">&#129475; 小安素<span class="pts">+3 點</span></button>
    <button class="drink-btn" data-kind="保久乳">&#129371; 保久乳<span class="pts">+1 點</span></button>
    <button class="drink-btn" data-kind="水">&#128167; 一瓶水<span class="pts">+1 點</span></button>
  </div>
  <div class="err" id="err"></div>
  <div class="hint">喝完按一下就記好；日期可以改成補記前幾天。所有裝置共用同一份雲端紀錄，離線也能記。</div>
</div>

<div class="card">
  <div class="cal-head">
    <button class="nav-btn" id="prev-m">&#8249;</button>
    <div class="m" id="cal-month"></div>
    <button class="nav-btn" id="next-m">&#8250;</button>
  </div>
  <div class="cal" id="cal-grid"></div>
</div>

<div class="card">
  <div class="day-title" id="day-title"></div>
  <div id="day-list"></div>
</div>

<footer>made with &hearts; by Daddy &amp; Claude</footer>
</div><script>
window.LoadingGate = (function () {
  'use strict';
  var el = document.getElementById('load-gate'), doneFlag = false;
  function done() {
    if (doneFlag || !el) return;
    doneFlag = true;
    el.classList.add('hide');
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 300);
  }
  setTimeout(done, 25000);  // 保險：離線或後端卡住時不要永遠鎖住
  return { done: done };
})();

'use strict';
const API = 'https://script.google.com/macros/s/AKfycbz2MC2MX7kLY6yNm_L4crX1TMY70M3xx81DcMuePbdTCoNg6uN6bvls4NYlSegXAoPQ/exec';
const GOAL = 100;
const CACHE_KEY = 'owen-drink-cache-v1';
const QUEUE_KEY = 'owen-drink-queue-v1';
const KIND_INFO = { '小安素': { pts: 3, emoji: '\u{1F9C3}' }, '保久乳': { pts: 1, emoji: '\u{1F95B}' }, '水': { pts: 1, emoji: '\u{1F4A7}' } };
function ptsOf(k) { return KIND_INFO[k] ? KIND_INFO[k].pts : 1; }
function emojiOf(k) { return KIND_INFO[k] ? KIND_INFO[k].emoji : '\u{1F37C}'; }

/* ---------- 本機儲存 ---------- */
function lsGet(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    if (!raw) return fallback;
    const v = JSON.parse(raw);
    return Array.isArray(v) ? v : fallback;
  } catch (err) { console.error('read', key, err); return fallback; }
}
function lsSet(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); }
  catch (err) { console.error('write', key, err); }
}

/* ---------- 狀態 ---------- */
let serverEntries = lsGet(CACHE_KEY, []);   // [{id, date, kind}]
let queue = lsGet(QUEUE_KEY, []);           // [{action:'drink_add',date,kind,tmp} | {action:'drink_del',id}]
let flushing = false;
const todayStr = localDateStr(new Date());
let view = { y: +todayStr.slice(0, 4), m: +todayStr.slice(5, 7) - 1 };
let selected = todayStr;

function localDateStr(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
/* 手機端先產生唯一 id 一起送出：重送／雙擊／逾時重試都不會多一筆（後端同 id 直接回「已有」） */
function newTmpId() { return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10); }

function currentEntries() {
  let out = serverEntries.slice();
  for (const op of queue) {
    if (op.action === 'drink_add') out = out.concat([{ id: op.tmp, date: op.date, kind: op.kind, pending: true }]);
    if (op.action === 'drink_del') out = out.filter(e => e.id !== op.id);
  }
  return out;
}
function byDate(date) { return currentEntries().filter(e => e.date === date); }
function pointsOf(list) { return list.reduce((s, e) => s + ptsOf(e.kind), 0); }

/* 表現扣分（penalty 工作表，三本共用）：total 顯示時扣除 */
let penalty = 0;
try { penalty = parseInt(localStorage.getItem('owen-penalty-cache') || '0', 10) || 0; } catch (e) {}
function applyPenalty(items, reasons) {
  if (!Array.isArray(items)) return;
  penalty = items.reduce((s, e) => s + (parseInt(e.value, 10) || 0), 0);
  try { localStorage.setItem('owen-penalty-cache', String(penalty)); } catch (e) {}
  if (window.PenaltyWidget) { window.PenaltyWidget.setItems(items); if (reasons) window.PenaltyWidget.setReasons(reasons); }
}
/* mode=all 回應：一次拿到本頁紀錄＋扣分＋扣分原因（舊後端沒有這些欄位 → 回 false 視為待更新） */
function applyAll(resp) {
  if (!resp || !resp.ok || !Array.isArray(resp.drinks)) return false;
  serverEntries = resp.drinks;
  lsSet(CACHE_KEY, serverEntries);
  applyPenalty(resp.penalty, resp.penalty_reasons);
  return true;
}

/* ---------- 同步 ---------- */
function apiFetch(opts) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 20000);
  const url = (opts && opts.method === 'POST') ? API : API + '?mode=all';
  return fetch(url, Object.assign({ signal: ctrl.signal }, opts))
    .then(r => { if (!r.ok) throw new Error('http ' + r.status); return r.json(); })
    .finally(() => clearTimeout(timer));
}
async function flush() {
  if (flushing) return;
  flushing = true;
  setStatus('sync');
  try {
    while (queue.length) {
      const op = queue[0];
      const body = op.action === 'drink_add'
        ? { action: 'drink_add', date: op.date, kind: op.kind, id: op.tmp }
        : { action: 'drink_del', id: op.id };
      const resp = await apiFetch({ method: 'POST', body: JSON.stringify(body) });
      if (!resp.ok) {
        if (resp.error === 'unknown action') { setStatus('stale'); return; }  // 後端未更新：保留佇列，之後自動補送
        if (resp.error === 'bad input') { queue = queue.slice(1); lsSet(QUEUE_KEY, queue); continue; }
        throw new Error(resp.error || 'server error');
      }
      queue = queue.slice(1);
      lsSet(QUEUE_KEY, queue);
      serverEntries = resp.drinks || [];
      lsSet(CACHE_KEY, serverEntries);
      renderAll();
    }
    const resp = await apiFetch({ method: 'GET' });
    if (!applyAll(resp)) { setStatus('stale'); return; }
    setStatus('ok');
  } catch (err) {
    console.error('sync failed', err);
    setStatus(queue.length ? 'offline' : 'error');
  } finally {
    flushing = false;
    renderAll();
    if (window.LoadingGate) window.LoadingGate.done();
  }
}

/* ---------- 操作 ---------- */
function addDrink(date, kind) {
  queue = queue.concat([{ action: 'drink_add', date, kind, tmp: newTmpId() }]);
  lsSet(QUEUE_KEY, queue);
  renderAll();
  flush();
}
function delDrink(id) {
  if (queue.some(op => op.action === 'drink_add' && op.tmp === id)) {  // 還沒上雲的直接撤掉
    queue = queue.filter(op => !(op.action === 'drink_add' && op.tmp === id));
  } else {
    queue = queue.concat([{ action: 'drink_del', id }]);
  }
  lsSet(QUEUE_KEY, queue);
  renderAll();
  flush();
}

/* ---------- 畫面 ---------- */
function setStatus(state) {
  const el = document.getElementById('sync-status');
  const pend = queue.length;
  if (state === 'sync') { el.className = ''; el.textContent = '同步中…'; }
  else if (state === 'ok') { el.className = 'ok'; el.textContent = '✓ 雲端已同步（多裝置共用）'; }
  else if (state === 'offline') { el.className = 'bad'; el.textContent = '離線中，' + pend + ' 筆待同步（連線後自動補送）'; }
  else if (state === 'stale') { el.className = 'bad'; el.textContent = '雲端後端待更新' + (pend ? '，' + pend + ' 筆已保留待補送' : '') + '（請爸爸更新 Apps Script）'; }
  else { el.className = 'bad'; el.textContent = '連不上雲端，先顯示上次資料'; }
}
function renderProgress() {
  const total = Math.max(0, pointsOf(currentEntries()) - penalty);
  const cycles = Math.floor(total / GOAL);
  const justHit = total > 0 && total % GOAL === 0;
  const inCycle = justHit ? GOAL : total % GOAL;
  const pct = Math.round(inCycle / GOAL * 100);
  const C = 2 * Math.PI * 70;
  const arc = document.getElementById('arc');
  arc.setAttribute('stroke-dasharray', (pct / 100 * C) + ' ' + C);
  arc.style.display = pct === 0 ? 'none' : '';
  document.getElementById('total').textContent = total;
  document.getElementById('pct').textContent = '本輪 ' + inCycle + ' / ' + GOAL;
  const gift = document.getElementById('gift-msg');
  let html = '';
  if (cycles > 0) {
    html += '<div class="done">' + '\u{1F381}'.repeat(Math.min(cycles, 8)) +
            ' 已達成 <b>' + cycles + '</b> 次換禮物！</div>';
  }
  if (justHit) {
    html += '<div class="left">第 ' + cycles + ' 個 ' + GOAL + ' 點達成！先去換禮物，下一輪繼續 &#127881;</div>';
  } else {
    html += '<div class="left">再喝 <b>' + (GOAL - total % GOAL) + '</b> 點換第 ' + (cycles + 1) + ' 個禮物 &#127873;</div>';
  }
  if (penalty > 0) {
    html += '<div class="left" style="color:#B0563F">&#9888;&#65039; 表現扣分 &minus;' + penalty + '</div>';
  }
  gift.innerHTML = html;
  const base = justHit ? (cycles - 1) * GOAL : cycles * GOAL;
  const miles = [base + 25, base + 50, base + 75, base + GOAL];
  document.getElementById('miles').innerHTML = miles.map(m =>
    '<span class="mile' + (total >= m ? ' hit' : '') + '">' + m + ' 點</span>').join('');
}
function renderCalendar() {
  const { y, m } = view;
  document.getElementById('cal-month').textContent = y + ' 年 ' + (m + 1) + ' 月';
  const first = new Date(y, m, 1).getDay();
  const days = new Date(y, m + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < first; i++) cells.push('<div class="day blank"></div>');
  for (let d = 1; d <= days; d++) {
    const ds = y + '-' + String(m + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
    const p = pointsOf(byDate(ds));
    const cls = ['day', p ? 'has' : '', ds === todayStr ? 'today' : '', ds === selected ? 'sel' : ''].filter(Boolean).join(' ');
    cells.push('<div class="' + cls + '" data-date="' + ds + '">' + d + (p ? '<span class="cnt">' + p + '</span>' : '') + '</div>');
  }
  document.getElementById('cal-grid').innerHTML =
    ['日','一','二','三','四','五','六'].map(w => '<div class="dow">' + w + '</div>').join('') + cells.join('');
}
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function renderDay() {
  const list = byDate(selected);
  document.getElementById('day-title').textContent = selected + ' 喝了什麼（' + pointsOf(list) + ' 點）';
  const box = document.getElementById('day-list');
  if (!list.length) { box.innerHTML = '<div class="empty">這天還沒有紀錄</div>'; return; }
  box.innerHTML = list.map(e =>
    '<div class="entry"><span class="bk">' + emojiOf(e.kind) + ' ' + esc(e.kind) + '</span>' +
    '<span class="p">+' + ptsOf(e.kind) + ' 點</span>' +
    (e.pending ? '<span class="pend">⏳ 還沒存到雲端</span>' : '') +
    '<button class="del" data-id="' + e.id + '">刪除</button></div>').join('');
}
function renderPending() {
  const bar = document.getElementById('pend-bar'), n = queue.length;
  bar.hidden = !n;
  bar.textContent = '⏳ 還有 ' + n + ' 筆沒存到雲端，正在送出…請先不要重複記';
}
function renderAll() { renderProgress(); renderCalendar(); renderDay(); renderPending(); }

/* ---------- 事件 ---------- */
document.getElementById('drink-btns').addEventListener('click', ev => {
  const btn = ev.target.closest('.drink-btn');
  if (!btn) return;
  const date = document.getElementById('in-date').value;
  if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return;
  if (btn.disabled) return;
  const all = document.querySelectorAll('.drink-btn'); all.forEach(b => { b.disabled = true; });
  setTimeout(() => all.forEach(b => { b.disabled = false; }), 3000);
  addDrink(date, btn.dataset.kind);
  selected = date;

})();
