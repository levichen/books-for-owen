<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Owen 的閱讀紀錄</title>
<meta name="robots" content="noindex">
<style>
@font-face { font-family:'Huninn'; src:url('../assets/huninn.woff2') format('woff2'); font-display:swap; }
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Huninn',system-ui,sans-serif;background:#FBF4E8;min-height:100vh;color:#4A3B32}
.wrap{max-width:760px;margin:0 auto;padding:26px 16px 60px}
h1{font-size:clamp(24px,5vw,34px);text-align:center}
.sub{color:#8A7460;text-align:center;margin:6px 0 6px;font-size:14px}
.back{display:inline-block;color:#8A7460;text-decoration:none;font-size:14px;margin-bottom:6px}
.card{background:#fff;border-radius:22px;box-shadow:0 8px 26px rgba(74,59,50,.10);padding:18px;margin-bottom:18px}

/* --- 同步狀態 --- */
.status{display:flex;justify-content:center;margin-bottom:14px}
.status span{font-size:12px;color:#8A7460;background:#F3EADA;border-radius:999px;padding:4px 12px}
.status span.ok{background:#E4F2E4;color:#4C7A4C}
.status span.bad{background:#FDEAE0;color:#B0563F}

/* --- 進度區：甜甜圈 + 大數字 --- */
.progress{display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:center}
.donut{position:relative;width:170px;height:170px;flex:0 0 auto}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.donut .num{font-size:38px;line-height:1}
.donut .pct{font-size:13px;color:#8A7460;margin-top:4px}
.gift{flex:1 1 220px;min-width:220px}
.gift .big{font-size:19px}
.gift .left{color:#8A7460;font-size:14px;margin-top:6px}
.gift .done{color:#E4574C;font-size:17px;margin-top:6px}
.milestones{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.mile{font-size:12px;color:#8A7460;background:#FBF4E8;border-radius:999px;padding:4px 10px}
.mile.hit{background:#E4574C;color:#fff}

/* --- 新增表單 --- */
.form-row{display:flex;gap:8px;flex-wrap:wrap}
input[type=date],input[type=text]{font-family:inherit;font-size:15px;color:#4A3B32;
  border:2px solid #E5D9C9;border-radius:12px;padding:10px 12px;background:#FFFDF8;outline:none}
input:focus{border-color:#E4574C}
input[type=date]{flex:0 0 auto}
input[type=text]{flex:1 1 180px;min-width:0}
button{font-family:inherit;font-size:15px;border:none;border-radius:999px;cursor:pointer}
.add-btn{background:#E4574C;color:#fff;padding:10px 22px}
.add-btn:disabled{opacity:.55;cursor:wait}
.add-btn:active{transform:scale(.97)}
.hint{color:#B8A88F;font-size:12px;margin-top:8px}
.err{color:#E4574C;font-size:13px;margin-top:8px;display:none}

/* --- 行事曆 --- */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-head .m{font-size:18px}
.nav-btn{background:#FBF4E8;color:#4A3B32;width:36px;height:36px;border-radius:50%;font-size:16px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{text-align:center;color:#B8A88F;font-size:12px;padding:4px 0}
.day{position:relative;aspect-ratio:1;border-radius:10px;background:#FFFDF8;border:2px solid transparent;
  display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-size:14px}
.day.blank{background:transparent;cursor:default}
.day.today{border-color:#F0B429}
.day.sel{border-color:#E4574C}
.day .cnt{position:absolute;right:3px;top:3px;background:#E4574C;color:#fff;font-size:10px;
  min-width:16px;height:16px;border-radius:999px;display:flex;align-items:center;justify-content:center;padding:0 3px}
.day.has{background:#FDEAE0}

/* --- 當日清單 --- */
.day-title{font-size:15px;margin-bottom:8px}
.entry{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed #EFE4D4}
.entry:last-child{border-bottom:none}
.entry .bk{flex:1;font-size:17px;word-break:break-all;line-height:1.5}
/* 直式注音在字右側（台灣課本式）：字＋右側注音欄＋聲調欄 */
.zc{display:inline-flex;align-items:center;vertical-align:middle;margin:2px 3px 2px 0}
.zc .h{font-size:19px;line-height:1.2}
.zc .zy{display:inline-flex;flex-direction:column;justify-content:center;margin-left:1.5px}
.zc .zy i{font-style:normal;font-size:9.5px;line-height:1.15;color:#8A7460;text-align:center;
  font-family:'Huninn',system-ui,sans-serif}
.zc .tn{font-size:10.5px;color:#8A7460;align-self:center;line-height:1;
  font-family:'Huninn',system-ui,sans-serif}
.entry .pend{font-size:12px;color:#B8A88F}
.del{background:#FBF4E8;color:#8A7460;padding:6px 12px;font-size:13px}
.empty{color:#B8A88F;font-size:14px}
footer{text-align:center;color:#B8A88F;font-size:13px;margin-top:30px}
</style></head><body><div class="wrap">
<a class="back" href="../">&larr; 回書架</a>
<h1>&#128214; Owen 的閱讀紀錄</h1>
<div class="sub">每天讀的書都記下來，每滿 100 本換一個禮物 &#127873;</div>
<div class="status"><span id="sync-status">同步中&hellip;</span></div>

<div class="card">
  <div class="progress">
    <div class="donut">
      <svg viewBox="0 0 170 170">
        <circle cx="85" cy="85" r="70" fill="none" stroke="#F0E4D3" stroke-width="18"/>
        <circle id="arc" cx="85" cy="85" r="70" fill="none" stroke="#E4574C" stroke-width="18"
                stroke-linecap="round" stroke-dasharray="0 440"/>
      </svg>
      <div class="center"><div class="num"><span id="total">0</span></div><div class="pct"><span id="pct">本輪 0 / 100</span></div></div>
    </div>
    <div class="gift">
      <div class="big">禮物進度</div>
      <div id="gift-msg"></div>
      <div class="milestones" id="miles"></div>
    </div>
  </div>
</div>

<div class="card">
  <form id="add-form" class="form-row">
    <input type="date" id="in-date" required>
    <input type="text" id="in-title" placeholder="今天讀了哪本書？" maxlength="100" required>
    <button type="submit" class="add-btn">新增</button>
  </form>
  <div class="err" id="err"></div>
  <div class="hint">書架上的書、學校的書、圖書館借的書都可以記；一天可以記很多本。所有裝置共用同一份雲端紀錄，離線也能記、連線自動同步。</div>
</div>

<div class="card">
  <div class="cal-head">
    <button class="nav-btn" id="prev-m">&#8249;</button>
    <div class="m" id="cal-month"></div>
    <button class="nav-btn" id="next-m">&#8250;</button>
  </div>
  <div class="cal" id="cal-grid"></div>
</div>

<div class="card">
  <div class="day-title" id="day-title"></div>
  <div id="day-list"></div>
</div>

<footer>made with &hearts; by Daddy &amp; Claude</footer>
</div><script>
'use strict';
const API = 'https://script.google.com/macros/s/AKfycbz2MC2MX7kLY6yNm_L4crX1TMY70M3xx81DcMuePbdTCoNg6uN6bvls4NYlSegXAoPQ/exec';
const GOAL = 100;
const CACHE_KEY = 'owen-reading-cache-v2';   // 雲端資料快照
const QUEUE_KEY = 'owen-reading-queue-v1';   // 離線佇列（未送達的操作）
const OLD_KEY   = 'owen-reading-log-v1';     // v1 純本機版資料（一次性搬上雲端）

/* ---------- 本機儲存（皆包 try/catch；不可變更新） ---------- */
function lsGet(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    if (!raw) return fallback;
    const v = JSON.parse(raw);
    return Array.isArray(v) ? v : fallback;
  } catch (err) { console.error('read', key, err); return fallback; }
}
function lsSet(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); }
  catch (err) { console.error('write', key, err); }
}

/* ---------- 狀態 ---------- */
let serverEntries = lsGet(CACHE_KEY, []);   // 最近一次雲端快照
let queue = lsGet(QUEUE_KEY, []);           // [{action:'add',date,title,tmp} | {action:'del',id}]
let flushing = false;
const todayStr = localDateStr(new Date());
let view = { y: +todayStr.slice(0, 4), m: +todayStr.slice(5, 7) - 1 };
let selected = todayStr;

function localDateStr(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function newTmpId() { return 'tmp-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

/* v1 搬遷：舊的純本機紀錄轉成待送佇列，之後照一般流程上雲 */
function migrateOld() {
  const old = lsGet(OLD_KEY, []);
  if (!old.length) { try { localStorage.removeItem(OLD_KEY); } catch (e) {} return; }
  const ops = old
    .filter(e => e && e.date && e.title)
    .map(e => ({ action: 'add', date: e.date, title: e.title, tmp: newTmpId() }));
  queue = queue.concat(ops);
  lsSet(QUEUE_KEY, queue);
  try { localStorage.removeItem(OLD_KEY); } catch (e) {}
}

/* 顯示用資料 = 雲端快照 + 佇列樂觀套用 */
function currentEntries() {
  let out = serverEntries.slice();
  for (const op of queue) {
    if (op.action === 'add') out = out.concat([{ id: op.tmp, date: op.date, title: op.title, pending: true }]);
    if (op.action === 'del') out = out.filter(e => e.id !== op.id);
  }
  return out;
}
function byDate(date) { return currentEntries().filter(e => e.date === date); }

/* ---------- 同步 ---------- */
function apiFetch(opts) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 20000);
  return fetch(API, Object.assign({ signal: ctrl.signal }, opts))
    .then(r => { if (!r.ok) throw new Error('http ' + r.status); return r.json(); })
    .finally(() => clearTimeout(timer));
}
async function flush() {
  if (flushing) return;
  flushing = true;
  setStatus('sync');
  try {
    while (queue.length) {
      const op = queue[0];
      const body = op.action === 'add'
        ? { action: 'add', date: op.date, title: op.title }
        : { action: 'del', id: op.id };
      const resp = await apiFetch({ method: 'POST', body: JSON.stringify(body) });
      if (!resp.ok) {
        if (resp.error === 'bad input' || resp.error === 'unknown action') {
          queue = queue.slice(1);  // 無效操作直接丟棄，避免卡死佇列
          lsSet(QUEUE_KEY, queue);
          continue;
        }
        throw new Error(resp.error || 'server error');
      }
      queue = queue.slice(1);
      lsSet(QUEUE_KEY, queue);
      serverEntries = resp.entries;
      lsSet(CACHE_KEY, serverEntries);
      renderAll();
    }
    if (!queue.length) {
      const resp = await apiFetch({ method: 'GET' });
      if (resp.ok) { serverEntries = resp.entries; lsSet(CACHE_KEY, serverEntries); }
    }
    setStatus('ok');
  } catch (err) {
    console.error('sync failed', err);
    setStatus(queue.length ? 'offline' : 'error');
  } finally {
    flushing = false;
    renderAll();
  }
}

/* ---------- 操作 ---------- */
function addBook(date, title) {
  queue = queue.concat([{ action: 'add', date, title, tmp: newTmpId() }]);
  lsSet(QUEUE_KEY, queue);
  renderAll();
  flush();
}
function delBook(id) {
  if (String(id).startsWith('tmp-')) {
    queue = queue.filter(op => !(op.action === 'add' && op.tmp === id));  // 還沒上雲的，直接從佇列撤掉
  } else {
    queue = queue.concat([{ action: 'del', id }]);
  }
  lsSet(QUEUE_KEY, queue);
  renderAll();
  flush();
}

/* ---------- 畫面 ---------- */
function setStatus(state) {
  const el = document.getElementById('sync-status');
  const pend = queue.length;
  if (state === 'sync') { el.className = ''; el.textContent = '同步中…'; }
  else if (state === 'ok') { el.className = 'ok'; el.textContent = '已同步（多裝置共用）'; }
  else if (state === 'offline') { el.className = 'bad'; el.textContent = '離線中，' + pend + ' 筆待同步（連線後自動補送）'; }
  else { el.className = 'bad'; el.textContent = '連不上雲端，先顯示上次資料'; }
}
function renderProgress() {
  const total = currentEntries().length;
  const cycles = Math.floor(total / GOAL);            // 已完成的百本輪數 = 可換禮物數
  const justHit = total > 0 && total % GOAL === 0;    // 剛好停在整百
  const inCycle = justHit ? GOAL : total % GOAL;      // 本輪進度（整百時顯示滿環）
  const pct = Math.round(inCycle / GOAL * 100);
  const C = 2 * Math.PI * 70;
  const arc = document.getElementById('arc');
  arc.setAttribute('stroke-dasharray', (pct / 100 * C) + ' ' + C);
  arc.style.display = pct === 0 ? 'none' : '';  // 0% 時隱藏，避免 round linecap 殘留圓點
  document.getElementById('total').textContent = total;
  document.getElementById('pct').textContent = '本輪 ' + inCycle + ' / ' + GOAL;
  const gift = document.getElementById('gift-msg');
  let html = '';
  if (cycles > 0) {
    html += '<div class="done">' + '\u{1F381}'.repeat(Math.min(cycles, 8)) +
            ' 已達成 <b>' + cycles + '</b> 次換禮物！</div>';
  }
  if (justHit) {
    html += '<div class="left">第 ' + cycles + ' 個 ' + GOAL + ' 本達成！先去換禮物，下一輪繼續 &#127881;</div>';
  } else {
    html += '<div class="left">再讀 <b>' + (GOAL - total % GOAL) + '</b> 本換第 ' + (cycles + 1) + ' 個禮物 &#127873;</div>';
  }
  gift.innerHTML = html;
  // 里程碑膠囊：顯示當前這一輪的四個絕對里程碑（例：125/150/175/200 本）
  const base = justHit ? (cycles - 1) * GOAL : cycles * GOAL;
  const miles = [base + 25, base + 50, base + 75, base + GOAL];
  document.getElementById('miles').innerHTML = miles.map(m =>
    '<span class="mile' + (total >= m ? ' hit' : '') + '">' + m + ' 本</span>').join('');
}
function renderCalendar() {
  const { y, m } = view;
  document.getElementById('cal-month').textContent = y + ' 年 ' + (m + 1) + ' 月';
  const first = new Date(y, m, 1).getDay();
  const days = new Date(y, m + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < first; i++) cells.push('<div class="day blank"></div>');
  for (let d = 1; d <= days; d++) {
    const ds = y + '-' + String(m + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');
    const n = byDate(ds).length;
    const cls = ['day', n ? 'has' : '', ds === todayStr ? 'today' : '', ds === selected ? 'sel' : ''].filter(Boolean).join(' ');
    cells.push('<div class="' + cls + '" data-date="' + ds + '">' + d + (n ? '<span class="cnt">' + n + '</span>' : '') + '</div>');
  }
  document.getElementById('cal-grid').innerHTML =
    ['日','一','二','三','四','五','六'].map(w => '<div class="dow">' + w + '</div>').join('') + cells.join('');
}
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

/* 注音字典（懶載入）：載到後書名逐字上 ruby，讓小一的 Owen 自己念得出書名 */
let ZY = null;
fetch('../assets/zhuyin.json')
  .then(r => r.ok ? r.json() : null)
  .then(m => { if (m) { ZY = m; renderDay(); } })
  .catch(err => console.error('zhuyin load failed', err));
function zyHtml(zy) {
  const last = zy.slice(-1);
  const tone = 'ˊˇˋ'.includes(last) ? last : '';     // 二三四聲：右側
  const light = last === '˙';                          // 輕聲：注音欄頂端
  const syms = (tone || light) ? zy.slice(0, -1) : zy;
  let col = light ? '<i>˙</i>' : '';
  for (const s of syms) col += '<i>' + s + '</i>';
  return '<span class="zy">' + col + '</span>' + (tone ? '<span class="tn">' + tone + '</span>' : '');
}
function rubyTitle(s) {
  let out = '';
  for (const ch of s) {
    const e = esc(ch);
    out += (ZY && ZY[ch])
      ? '<span class="zc"><span class="h">' + e + '</span>' + zyHtml(ZY[ch]) + '</span>'
      : e;
  }
  return out;
}

function renderDay() {
  document.getElementById('day-title').textContent = selected + ' 讀了什麼';
  const list = byDate(selected);
  const box = document.getElementById('day-list');
  if (!list.length) { box.innerHTML = '<div class="empty">這天還沒有紀錄</div>'; return; }
  box.innerHTML = list.map(e =>
    '<div class="entry"><span class="bk">&#128214; ' + rubyTitle(e.title) + '</span>' +
    (e.pending ? '<span class="pend">待同步</span>' : '') +
    '<button class="del" data-id="' + e.id + '">刪除</button></div>').join('');
}
function renderAll() { renderProgress(); renderCalendar(); renderDay(); }
function showError(msg) { const el = document.getElementById('err'); el.textContent = msg; el.style.display = 'block'; }
function clearError() { document.getElementById('err').style.display = 'none'; }

/* ---------- 事件 ---------- */
document.getElementById('add-form').addEventListener('submit', ev => {
  ev.preventDefault(); clearError();
  const date = document.getElementById('in-date').value;
  const title = document.getElementById('in-title').value.trim();
  if (!date || !/^\d{4}-\d{2}-\d{2}$/.test(date)) { showError('請選擇日期'); return; }
  if (!title) { showError('請填書名'); return; }
  if (title.length > 100) { showError('書名太長（100 字內）'); return; }
  addBook(date, title);
  selected = date;
  view = { y: +date.slice(0, 4), m: +date.slice(5, 7) - 1 };
  document.getElementById('in-title').value = '';
  renderAll();
});
document.getElementById('cal-grid').addEventListener('click', ev => {
  const cell = ev.target.closest('.day');
  if (!cell || !cell.dataset.date) return;
  selected = cell.dataset.date;
  renderCalendar(); renderDay();
});
document.getElementById('day-list').addEventListener('click', ev => {
  const btn = ev.target.closest('.del');
  if (!btn) return;
  delBook(btn.dataset.id);
});
document.getElementById('prev-m').addEventListener('click', () => {
  view = view.m === 0 ? { y: view.y - 1, m: 11 } : { y: view.y, m: view.m - 1 };
  renderCalendar();
});
document.getElementById('next-m').addEventListener('click', () => {
  view = view.m === 11 ? { y: view.y + 1, m: 0 } : { y: view.y, m: view.m + 1 };
  renderCalendar();
});
window.addEventListener('online', flush);
document.addEventListener('visibilitychange', () => { if (!document.hidden) flush(); });  // 回到頁面時拉最新（別台裝置可能記了）

document.getElementById('in-date').value = todayStr;
migrateOld();
renderAll();
flush();
</script></body></html>
